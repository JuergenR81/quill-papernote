name: Release

on:
  # The normal path: tag a commit whose packages/quill/package.json carries that
  # version, push the tag, and this builds and attaches the tarball.
  push:
    tags: ["v*"]
  # The rehearsal: run it by hand to see what a release would do. Defaults to a dry
  # run, so the button cannot publish anything by accident.
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and pack only; do not create a release."
        type: boolean
        default: true
        required: true

# The token GitHub generates for this run needs write access to create the release.
permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/_test.yml

  release:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v2
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - run: pnpm install --frozen-lockfile

      # A manual run is a dry run unless the box was unticked; a tag push never is.
      - run: ./scripts/release.js ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive npm package tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm
          path: |
            packages/quill/*.tgz
