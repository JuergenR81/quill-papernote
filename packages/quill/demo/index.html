<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Quill Next — local dev</title>
    <!-- Same-origin relative paths: served by this dev server on whatever port it picked,
         so there is no hardcoded port and no mixed content. -->
    <link rel="stylesheet" href="./quill.snow.css" />
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 24px; background: #fafafa; color: #111; }
      main { max-width: 900px; margin: 0 auto; }
      h1 { font-size: 16px; margin: 0 0 16px; font-weight: 600; }
      #editor { height: 280px; background: #fff; }
      #delta { background: #fff; border: 1px solid #e3e3e3; border-radius: 6px; padding: 12px; margin-top: 16px;
               font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; max-height: 220px; overflow: auto; }
      .err { background: #fdecea; border: 1px solid #f5c2bd; color: #b3261e; padding: 12px; border-radius: 6px; }

      /* Custom entries for the font picker. Quill renders the value as a class, so each
         one needs a rule to be visible, and a ::before to be labelled in the dropdown.
         serif and monospace ship with quill.snow.css already.

         Each stack leads with a Windows/macOS face and falls back to one that exists on
         a typical Linux desktop, so all five options really do render differently
         everywhere. Comic Sans and Impact are deliberately not used: neither exists on
         Linux, and both collapse onto the same fallback as the entries below. */
      .ql-font-narrow { font-family: 'Arial Narrow', 'Liberation Sans Narrow', 'Nimbus Sans Narrow', sans-serif; }
      .ql-font-script { font-family: 'Brush Script MT', 'Z003', 'URW Chancery L', cursive; }

      .ql-snow .ql-picker.ql-font .ql-picker-label[data-value='narrow']::before,
      .ql-snow .ql-picker.ql-font .ql-picker-item[data-value='narrow']::before {
        content: 'Narrow';
        font-family: 'Arial Narrow', 'Liberation Sans Narrow', sans-serif;
      }
      .ql-snow .ql-picker.ql-font .ql-picker-label[data-value='script']::before,
      .ql-snow .ql-picker.ql-font .ql-picker-item[data-value='script']::before {
        content: 'Script';
        font-family: 'Brush Script MT', 'Z003', cursive;
      }
      /* The font picker needs room for the longer labels. */
      .ql-snow .ql-picker.ql-font { width: 150px; }

      #formats { background: #fff; border: 1px solid #e3e3e3; border-radius: 6px; padding: 12px;
                 margin-top: 16px; font: 12px/1.6 ui-monospace, monospace; min-height: 42px; }
      #formats b { color: #0a7d34; }
      #formats .none { color: #999; }
      .legend { color: #666; font-size: 12px; line-height: 1.6; margin: 10px 2px 0; }
      .legend code { background: #eee; padding: 1px 4px; border-radius: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Quill Next — local dev build</h1>
      <div id="toolbar">
        <span class="ql-formats">
          <select class="ql-font">
            <option selected></option>
            <option value="serif"></option>
            <option value="monospace"></option>
            <option value="narrow"></option>
            <option value="script"></option>
          </select>
          <select class="ql-size"></select>
          <select class="ql-color"></select>
          <select class="ql-background"></select>
        </span>
        <span class="ql-formats">
          <button class="ql-bold"></button>
          <button class="ql-italic"></button>
          <button class="ql-underline"></button>
          <button class="ql-strike"></button>
          <button class="ql-link"></button>
          <button class="ql-code"></button>
        </span>
        <span class="ql-formats">
          <button class="ql-header" value="1"></button>
          <button class="ql-header" value="2"></button>
          <button class="ql-blockquote"></button>
        </span>
        <span class="ql-formats">
          <button class="ql-list" value="check"></button>
          <button class="ql-list" value="bullet"></button>
          <button class="ql-list" value="ordered"></button>
          <button class="ql-indent" value="-1"></button>
          <button class="ql-indent" value="+1"></button>
        </span>
        <span class="ql-formats">
          <button class="ql-clean"></button>
        </span>
      </div>
      <div id="editor"></div>
      <div id="formats">—</div>
      <p class="legend">
        Formats that are <em>meant</em> to end, so losing them is not a bug:
        <code>link</code> and <code>code</code> at a hard line break,
        <code>header</code> on the line after a heading, everything after the
        <em>clear formatting</em> button, and any format the caret leaves by moving
        into differently formatted text.
      </p>
      <div id="delta">—</div>
    </main>

    <script src="./quill.js"></script>
    <script>
      if (typeof Quill === 'undefined') {
        document.querySelector('main').innerHTML =
          '<p class="err">quill.js did not load. Run <code>pnpm --filter quill-next run build</code>, ' +
          'then reload — the dev server serves the build output from dist/.</p>';
      } else {
        var Delta = Quill.import('delta');

        // Quill only accepts font values that are on the whitelist, so the extra picker
        // entries have to be registered before the editor is constructed.
        var Font = Quill.import('formats/font');
        Font.whitelist = ['serif', 'monospace', 'narrow', 'script'];
        Quill.register(Font, true);

        var quill = new Quill('#editor', {
          theme: 'snow',
          placeholder: 'Type here…',
          modules: { toolbar: '#toolbar' },
        });

        quill.setContents(
          new Delta()
            .insert('bold red text', { bold: true, color: '#e60000' })
            .insert('\n')
            .insert('script font, huge and bold', {
              font: 'script',
              size: 'huge',
              bold: true,
            })
            .insert('\n')
            .insert('narrow font with a background', {
              font: 'narrow',
              background: '#ffff00',
            })
            .insert('\n')
            .insert('monospace italic', { font: 'monospace', italic: true })
            .insert('\n')
            .insert('a link to example.com', { link: 'https://example.com' })
            .insert('\n')
            .insert('checkbox small', { size: 'small' })
            .insert('\n', { list: 'unchecked' })
            .insert('checkbox normal')
            .insert('\n', { list: 'unchecked' })
            .insert('checkbox large', { size: 'large' })
            .insert('\n', { list: 'checked' })
            .insert('checkbox huge', { size: 'huge' })
            .insert('\n', { list: 'checked' })
            .insert('plain line\n'),
        );

        // Shows what the caret currently carries, so a format that disappears is visible
        // the moment it happens instead of having to be read out of the Delta.
        var renderFormats = function () {
          var range = quill.getSelection();
          var target = document.getElementById('formats');
          if (!range) {
            target.innerHTML = '<span class="none">no selection</span>';
            return;
          }
          var formats = quill.getFormat(range);
          var current = Object.keys(formats)
            .sort()
            .map(function (name) {
              return name + '=' + JSON.stringify(formats[name]);
            })
            .join('   ');

          target.innerHTML =
            'format at caret (' + range.index + ', ' + range.length + '):  ' +
            (current ? '<b>' + current + '</b>' : '<span class="none">none</span>');
        };

        var render = function () {
          var li = quill.root.querySelector('li[data-list]');
          document.getElementById('delta').textContent =
            'Delta:\n' +
            JSON.stringify(quill.getContents().ops, null, 1)
              .split(String.fromCharCode(0x2028))
              .join('\\u2028') +
            (li
              ? '\n\nchecklist item: role=' + li.getAttribute('role') +
                ' aria-checked=' + li.getAttribute('aria-checked')
              : '');
          renderFormats();
        };
        quill.on('editor-change', render);
        render();
      }
    </script>
  </body>
</html>
